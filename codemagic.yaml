workflows:
  mpt_android_debug:
    name: MPT v1.5.1 Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms=android --project-name korea_prayer_times --org com.koreaprayertimes .
      - name: Set Android app label and notification components
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path('android/app/src/main/AndroidManifest.xml')
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          key = lambda name: f'{{{android_ns}}}{name}'
          tree = ET.parse(p)
          manifest = tree.getroot()
          permissions = (
              'android.permission.INTERNET',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
          )
          present = {x.get(key('name')) for x in manifest.findall('uses-permission')}
          for name in permissions:
              if name not in present:
                  ET.SubElement(manifest, 'uses-permission', {key('name'): name})

          app = manifest.find('application')
          if app is None:
              raise RuntimeError('AndroidManifest.xml has no application element')
          app.set(key('label'), 'MPT')
          receivers = {
              'com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver': [],
              'com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver': [
                  'android.intent.action.BOOT_COMPLETED',
                  'android.intent.action.MY_PACKAGE_REPLACED',
                  'android.intent.action.QUICKBOOT_POWERON',
                  'com.htc.intent.action.QUICKBOOT_POWERON',
              ],
          }
          existing = {r.get(key('name')) for r in app.findall('receiver')}
          for receiver_name, actions in receivers.items():
              if receiver_name in existing:
                  continue
              receiver = ET.SubElement(app, 'receiver', {
                  key('name'): receiver_name,
                  key('exported'): 'false' if not actions else 'true',
              })
              if actions:
                  intent_filter = ET.SubElement(receiver, 'intent-filter')
                  for action in actions:
                      ET.SubElement(intent_filter, 'action', {key('name'): action})
          tree.write(p, encoding='utf-8', xml_declaration=True)
          print('Updated AndroidManifest.xml with notification receivers')
          PY
      - name: Enable desugaring
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          if p.exists():
              s=p.read_text()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s=s.replace('android {','android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
                  s=s.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',1) if 'dependencies {' in s else s+'\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              p.write_text(s)
          PY
      - name: Install native automatic Adhan alarm service
        script: python3 apply_native_v150.py
      - name: Install dependencies
        script: flutter pub get
      - name: Generate launcher icon
        script: dart run flutter_launcher_icons
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
