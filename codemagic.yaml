workflows:
  mpt_android_debug:
    name: MPT v1.5.3 Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Verify correct Flutter source
        script: python3 verify_source.py
      - name: Generate Android project
        script: flutter create --platforms=android --project-name korea_prayer_times --org com.koreaprayertimes .
      - name: Install native automatic Adhan alarm service
        script: python3 apply_native_v150.py
      - name: Verify repository and native files
        script: python3 verify_mpt.py
      - name: Enable desugaring
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          if not p.exists():
              raise SystemExit('Missing android/app/build.gradle.kts')
          s=p.read_text()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s=s.replace('android {','android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
              if 'dependencies {' in s:
                  s=s.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',1)
              else:
                  s+='\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Generate launcher icon
        script: dart run flutter_launcher_icons
      - name: Analyze Flutter source
        script: flutter analyze --no-fatal-infos
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
