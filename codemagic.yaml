workflows:
  mpt_android_debug:
    name: MPT v1.4.3 Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Apply MPT v1.4.3 update
        script: python3 mpt_update_v143.py
      - name: Generate Android project
        script: flutter create --platforms=android --project-name korea_prayer_times --org com.koreaprayertimes .
      - name: Set Android label and permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:label="korea_prayer_times"','android:label="MPT"')
          perms=['android.permission.INTERNET','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.POST_NOTIFICATIONS']
          for perm in perms:
              if perm not in s:
                  s=s.replace('<application',f'<uses-permission android:name="{perm}"/>\n    <application',1)
          p.write_text(s)
          PY
      - name: Enable desugaring
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          if p.exists():
              s=p.read_text()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s=s.replace('android {','android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
                  if 'dependencies {' in s:
                      s=s.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',1)
                  else:
                      s+='\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              p.write_text(s)
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Generate launcher icon
        script: dart run flutter_launcher_icons
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
